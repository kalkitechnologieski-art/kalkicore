<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <style>
      @keyframes pulse {
        0%, 100% { opacity: 0.6; }
        50% { opacity: 1; }
      }
      @keyframes glow {
        0%, 100% { filter: drop-shadow(0 0 5px #00f0ff) drop-shadow(0 0 10px #00f0ff); }
        50% { filter: drop-shadow(0 0 15px #00f0ff) drop-shadow(0 0 30px #00f0ff); }
      }
      .bg { fill: #0A0A0F; }
      .border { stroke: #00f0ff; stroke-width: 2; fill: none; }
      .text { fill: #00f0ff; font-family: 'Inter', sans-serif; font-weight: 700; font-size: 44px; text-anchor: middle; dominant-baseline: central; }
      .pulse { animation: pulse 1.5s ease-in-out infinite; }
      .glow { animation: glow 2s ease-in-out infinite; }
    </style>
  </defs>
  <rect class="bg" width="100" height="100" rx="20" />
  <rect class="border glow" x="2" y="2" width="96" height="96" rx="18" />
  <text class="text pulse" x="50" y="52">KI</text>
</svg>
